name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  fast-tests:
    name: Fast tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run fast tests
        run: python -m pytest -m "not integration" -v

  integration-tests:
    name: PostgreSQL integration test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: internship_tracker
          POSTGRES_PASSWORD: integration_test_password
          POSTGRES_DB: internship_tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U internship_tracker -d internship_tracker_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql+psycopg://internship_tracker:integration_test_password@127.0.0.1:5432/internship_tracker_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run PostgreSQL integration test
        run: python -m pytest -m integration -v

  container-validation:
    name: Container validation
    runs-on: ubuntu-latest

    env:
      POSTGRES_USER: internship_tracker
      POSTGRES_PASSWORD: container_test_password
      POSTGRES_DB: internship_tracker

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Docker Compose configuration
        run: docker compose config

      - name: Validate containerized application
        run: bash scripts/validate-containers.sh

      - name: Clean up containers
        if: always()
        run: docker compose down -v --remove-orphans
