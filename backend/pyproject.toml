[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "internship-application-tracker"
version = "0.1.0"
description = "A self-hosted API for managing internship applications."
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard-no-fastapi-cloud-cli]",
    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary]>=3.3,<4.0",
    "alembic>=1.18,<2.0",
    "pydantic-settings>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "httpx2",
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]
